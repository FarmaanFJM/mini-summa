# Packaging for Mini-Summa. Build the app first (electron-vite build), then:
#   npm run dist:win   (NSIS installer, x64; also builds from Linux, see scripts/fetch-win-natives.mjs)
#   npm run dist:dir   (unpacked Linux build, used by the smoke test)
appId: com.minisumma.app
productName: Mini-Summa
copyright: Copyright (c) Mini-Summa contributors
directories:
  output: release
  buildResources: build

# package.json says ^45.1.0 and the dependency is hoisted to the repository root, so electron-builder cannot read the
# version from node_modules. scripts/before-pack.cjs fails the build if this and the installed Electron ever differ.
electronVersion: 45.1.0

# The NSIS target needs to run its own stub once to produce the uninstaller. On Windows that is native. Elsewhere
# electron-builder downloads a portable wine (a checksummed bundle from electron-builder-binaries) so that no system
# wine is needed. Ignored when building on Windows.
toolsets:
  wine: '1.0.1'

asar: true
# Nothing is compiled at install time; the native pty ships as a prebuilt per-platform package.
npmRebuild: false
nodeGypRebuild: false

beforePack: scripts/before-pack.cjs

# Only what the bundled main process needs at run time. electron-builder would otherwise copy every production
# dependency listed in package.json (React, xterm, ...), which the renderer bundle already contains.
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/**'
  - node_modules/ws/**
  - node_modules/@lydell/node-pty/**

extraResources:
  # The hook script runs as `Mini-Summa.exe capture.mjs` (Electron in Node mode), so it must be a real file, not inside app.asar.
  - from: ../../packages/claude-integration/dist/capture.mjs
    to: hook/capture.mjs
  - from: resources
    to: icons
    filter:
      - icon.png
      - tray.png
      - tray@2x.png

# The pty is native code plus helper programs (conpty.dll, OpenConsole.exe) that must sit on the real disk. Unpacking the
# whole package keeps its .node files, helper programs and worker scripts together.
# electron-builder matches these against each file's path relative to this folder. The per-platform pty package is added
# as a file set from build/native (staged by scripts/before-pack.cjs), so that is the path the second pattern has to match.
asarUnpack:
  - node_modules/@lydell/node-pty*/**
  - build/native/node_modules/@lydell/node-pty*/**

protocols:
  - name: Mini-Summa link
    schemes:
      - minisumma

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # No administrator rights, ever.
  requestedExecutionLevel: asInvoker
  # Building from Linux without wine: the executable is not edited or signed (see the report: icon and version info of
  # the .exe itself need a Windows or wine build).
  signAndEditExecutable: false
  artifactName: Mini-Summa-Setup-${version}-${arch}.${ext}
  # The Windows pty is fetched by scripts/fetch-win-natives.mjs (the beforePack hook runs it) and added to the app as an
  # ordinary node_modules package, so @lydell/node-pty finds it with its usual require(`...-${process.platform}-${process.arch}`).
  files:
    - from: build/native/node_modules/@lydell/node-pty-win32-x64
      to: node_modules/@lydell/node-pty-win32-x64
      filter:
        - '**/*'
        - '!**/*.pdb'
        - '!.fetched-integrity'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mini-Summa
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

linux:
  # The Linux build (used by the smoke test) takes the pty from the installed package, staged into build/native by
  # scripts/before-pack.cjs. (A file set, because electron-builder does not merge platform-specific plain patterns into
  # its node_modules filter.)
  files:
    - from: build/native/node_modules/@lydell/node-pty-linux-x64
      to: node_modules/@lydell/node-pty-linux-x64
      filter:
        - '**/*'
  target: dir
  icon: build/icon.png
  executableName: mini-summa
  category: Utility
